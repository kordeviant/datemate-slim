version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datemate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: datemate_db
    ports:
      - "5432:5432"
    volumes:
      - datemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datemate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: datemate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - datemate_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: datemate_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - datemate_miniodata:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datemate_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/datemate_db?sslmode=disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      STORAGE_DRIVER: "local"
      UPLOADS_DIR: "/app/uploads"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "datemate-uploads"
      S3_USE_SSL: "false"
      JWT_ACCESS_SECRET: "datemate_jwt_access_super_secret_key_2026"
      JWT_REFRESH_SECRET: "datemate_jwt_refresh_super_secret_key_2026"
      INTERNAL_API_KEY: "datemate_internal_api_key_2026"
      DEVICE_TOKEN_API_KEY: "datemate_device_token_api_key_2026"
      PUSH_NOTIFICATION_API_KEY: "datemate_push_notification_api_key_2026"
      GEO_DATA_DIR: "/app/data/geo"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: datemate_nginx
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  datemate_pgdata:
  datemate_redisdata:
  datemate_miniodata:
