image: node:20-alpine

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm ci
    - npx prisma generate
    - npm test

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$SSH_PRIVATE_KEY" || (echo "SSH_PRIVATE_KEY is unavailable; check its Protected flag and environment scope" && exit 1)
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        if grep -q "BEGIN" "$SSH_PRIVATE_KEY"; then
          (cat "$SSH_PRIVATE_KEY"; echo "") | tr -d '\r' > /tmp/deploy_key
        else
          tr -d '\r\n ' < "$SSH_PRIVATE_KEY" | base64 -d > /tmp/deploy_key
        fi
      else
        if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN"; then
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/deploy_key
        else
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d > /tmp/deploy_key
        fi
      fi
    - test -s /tmp/deploy_key || (echo "Decoded SSH private key is empty" && exit 1)
    - chmod 600 /tmp/deploy_key
    - ssh-keygen -y -f /tmp/deploy_key >/dev/null
  script:
    - |
      ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT:-22} $SERVER_USER@$SERVER_IP "
        set -e
        eval cd \"\$DEPLOY_DIR\"
        git fetch origin main
        git reset --hard origin/main
        npm ci
        npx prisma migrate deploy
        npx prisma generate
        npm run build
        pm2 reload datemate-backend || pm2 start dist/main.js --name 'datemate-backend'
        pm2 save
      "