# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# Rate Limiting Zones & Global Policy (http context)
# ==============================================================================
# Zone: api_limit (10 MB shared memory stores ~160,000 active client IP states)
# Rate: 10 requests per second per client IP ($binary_remote_addr)
# Default rejection status: HTTP 429 Too Many Requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Upstream to DateMate Backend (NestJS on port 2020)
upstream datemate_backend {
    server 127.0.0.1:2020;
    keepalive 32;
}

# Upstream to DateMate Downloads Server (routed internally to DateMate Backend port 2020)
upstream datemate_downloads {
    server 127.0.0.1:2020;
    keepalive 32;
}

# Upstream to DateMate Admin Panel (Next.js in Docker on port 3001)
upstream datemate_panel {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Upstream to DateMate Chat Service (Docker on port 3002)
upstream datemate_chat {
    server 127.0.0.1:3002;
    keepalive 32;
}

# ==============================================================================
# 1. API Service (api-datemate.testdevvvv.site, api-datemate.testevvvv.site)
# ==============================================================================

# HTTP Server: Port 80
server {
    listen 80;
    listen [::]:80;
    server_name api-datemate.testdevvvv.site api-datemate.testevvvv.site;

    # Let's Encrypt / Certbot renewal challenge path
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Deny sensitive files, private keys, SSH credentials, and scanner probe paths
    location ~* (/(?:\.?ssh|\.?keys)(?:/|$)|id_rsa|id_ed25519|private_key\.pem) {
        return 404;
    }

    # Custom 429 error handler returning unified JSON envelope
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"status":"error","message":"Too Many Requests","data":null,"error":{"type":"UNKNOWN_ERROR","message":"Too Many Requests"}}';
    }

    # Proxy directly to NestJS Backend
    location / {
        # Rate limiting: 10 requests/s per client IP, burst allowance of 30, nodelay
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://datemate_backend;

        # HTTP 1.1 and WebSockets / Socket.IO support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}

# HTTPS Server: Port 443 (TLS Termination)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-datemate.testdevvvv.site api-datemate.testevvvv.site;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max upload size (for profile pictures and media)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Deny sensitive files, private keys, SSH credentials, and scanner probe paths
    location ~* (/(?:\.?ssh|\.?keys)(?:/|$)|id_rsa|id_ed25519|private_key\.pem) {
        return 404;
    }

    # Custom 429 error handler returning unified JSON envelope
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"status":"error","message":"Too Many Requests","data":null,"error":{"type":"UNKNOWN_ERROR","message":"Too Many Requests"}}';
    }

    # Reverse Proxy to NestJS Backend
    location / {
        # Rate limiting: 10 requests/s per client IP, burst allowance of 30, nodelay
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://datemate_backend;

        # HTTP 1.1 and WebSockets / Socket.IO support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}


