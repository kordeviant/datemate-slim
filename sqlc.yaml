version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platform/database/schema.sql"
    queries: "internal/platform/database/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/platform/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
