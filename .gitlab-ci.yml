image: node:latest

stages:
  - build
  - test
  - docker-build

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - echo "Building the project.."
    - npm install
    - npm run build
    - echo "Build successfully!"

test:
  stage: test
  script:
    - echo "Running tests.."
    - npm test
    - echo "Tests completed!"

docker-build:
  stage: docker-build
  image: 
    name: docker:27-cli
    entrypoint: [""]
  before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - docker compose up -d
  - echo "Built Docker Image Successfully!"
