version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datemate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: datemate_db
    ports:
      - "5432:5432"
    volumes:
      - datemate_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: datemate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - datemate_redisdata:/data

  cassandra:
    image: cassandra:4.1
    container_name: datemate_cassandra
    restart: always
    environment:
      - CASSANDRA_CLUSTER_NAME=datemate_chat_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    volumes:
      - datemate_cassandradata:/var/lib/cassandra

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datemate_backend
    restart: always
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - cassandra

  nginx:
    image: nginx:alpine
    container_name: datemate_nginx
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - postgres
      - redis
      - backend

volumes:
  datemate_pgdata:
  datemate_redisdata:
  datemate_cassandradata:
