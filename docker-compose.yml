version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: datemate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: datemate_db
    ports:
      - "5432:5432"
    volumes:
      - datemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datemate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: datemate_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - datemate_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datemate_backend
    restart: always
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data:ro
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: datemate_nginx
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - postgres
      - redis
      - backend

volumes:
  datemate_pgdata:
  datemate_redisdata:
