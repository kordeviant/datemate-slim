image: node:20-alpine

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm ci
    - npx prisma generate
    - npm test

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p ${SSH_PORT:-22} -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -p ${SSH_PORT:-22} $SERVER_USER@$SERVER_IP "
        set -e
        cd $DEPLOY_DIR
        git fetch origin main
        git reset --hard origin/main
        npm ci
        npx prisma migrate deploy
        npx prisma generate
        npm run build
        pm2 reload datemate-backend || pm2 start dist/main.js --name 'datemate-backend'
        pm2 save
      "