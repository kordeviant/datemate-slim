image: node:20-alpine

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm ci
    - npx prisma generate
    - npm test

deploy:
  stage: deploy
  image: debian:bookworm-slim
  only:
    - main
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-add ~/.ssh/id_deploy
    - ssh-keyscan -p ${SSH_PORT:-22} -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -p ${SSH_PORT:-22} $SERVER_USER@$SERVER_IP "
        set -e
        cd $DEPLOY_DIR
        git fetch origin main
        git reset --hard origin/main
        npm ci
        npx prisma migrate deploy
        npx prisma generate
        npm run build
        pm2 reload datemate-backend || pm2 start dist/main.js --name 'datemate-backend'
        pm2 save
      "